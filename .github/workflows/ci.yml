name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sunday_heroes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Overrides the port-5433 URL in apps/server/.env.test; dotenv never overrides a set variable.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sunday_heroes_test
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build shared types
        run: npm run build --workspace=@repo/shared-types

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/server

      - run: npm run lint

      - run: npm run format:check

      - run: npm run check-types

      - run: npm run test
