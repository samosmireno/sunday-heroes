# Disposable Postgres for the test harness. `docker compose up -d` is the only
# local setup step; `npm test` applies the migrations and truncates between tests.
# Published on 5433 so it never collides with a native Postgres on 5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sunday_heroes_test
    ports:
      - "5433:5432"
    # Data lives in memory: the database is rebuilt from the migrations on every
    # test run, so nothing needs to survive a container restart.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunday_heroes_test"]
      interval: 5s
      timeout: 5s
      retries: 10
